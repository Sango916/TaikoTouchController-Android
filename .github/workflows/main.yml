name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find gradlew and build
      run: |
        # リポジトリ内から gradlew がある場所を自動で探します
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "エラー: gradlew がリポジトリ内に見つかりません！"
          exit 1
        fi
        
        # gradlew があるフォルダに移動します
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        echo "ビルド対象のフォルダに移動しました: $(pwd)"
        
        # 実行権限を与えてビルドします
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 生成されたAPKをフォルダの場所に関わらず自動で見つけて保存します
        path: "**/build/outputs/apk/debug/*-debug.apk"
