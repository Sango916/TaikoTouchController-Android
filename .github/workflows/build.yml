name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring fixed debug.keystore from repository base64..."
            python3 -c "import base64, re; text = open('debug.keystore.base64').read(); clean = re.sub(r'[^A-Za-z0-9+/=]', '', text); open('debug.keystore', 'wb').write(base64.b64decode(clean))"
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore
          echo "=== Keystore SHA-256 Certificate Fingerprint ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" || true

      - name: Build Debug APK
        run: |
          RUN_NUM="${{ github.run_number }}"
          VC=$((2000 + RUN_NUM))
          echo "Building with versionCode=$VC"
          gradle assembleDebug -PversionCode=$VC

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

