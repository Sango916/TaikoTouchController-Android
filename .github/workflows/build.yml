name: Build Android APK
 
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring fixed debug.keystore from GitHub Secrets (KEYSTORE_BASE64)..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring fixed debug.keystore from repository base64..."
            python3 -c "import base64, re; text = open('debug.keystore.base64').read(); clean = re.sub(r'[^A-Za-z0-9+/=]', '', text); open('debug.keystore', 'wb').write(base64.b64decode(clean))"
          fi
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          echo "=== Keystore SHA-256 Certificate Fingerprint ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" || true

      - name: Determine Version Name and Code
        id: version_info
        run: |
          RUN_NUM="${{ github.run_number }}"
          VC=$((2000 + RUN_NUM))
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="$TAG_NAME"
            APK_NAME="TTC-v${TAG_NAME}.apk"
          else
            VERSION_NAME="debug"
            APK_NAME="TTC-debug.apk"
          fi
          
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "Target Version Name: $VERSION_NAME, Version Code: $VC, APK Name: $APK_NAME"

      - name: Build APK
        run: |
          gradle assembleDebug -PversionCode=${{ steps.version_info.outputs.version_code }} -PversionName=${{ steps.version_info.outputs.version_name }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.apk_name }}
          path: app/build/outputs/apk/debug/${{ steps.version_info.outputs.apk_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            scripts/TTC-receiver-windows.ps1
            scripts/TTC-receiver-macos.command
            scripts/TTC-receiver-linux.sh
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

